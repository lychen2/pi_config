name: verify-repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["0.82.0", "0.84.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Verify all extension packages
        run: node scripts/verify-repository.mjs --pi-version=${{ matrix.pi-version }}
