name: verify-repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the engines floor every package declares; 26 tracks the
        # Node/npm pair the maintained profile actually runs.
        node-version: ["22.19.0", "26"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify active packages on Pi 1.0.0
        run: node scripts/verify-repository.mjs --default-profile --pi-version=1.0.0
      - name: Verify retired package references are absent
        run: node scripts/verify-install-regressions.mjs

  windows-archive:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: Verify archive replacement and rollback
        run: node --test scripts/windows-archive-update.test.mjs
