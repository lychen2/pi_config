<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"screen","type":"string","label":"屏幕截图（真实界面）","default":"assets/studio.jpg"},
  {"id":"cursorSvg","type":"string","label":"光标 / 标志 SVG","default":"assets/cursor.svg"},
  {"id":"bubbleSvg","type":"string","label":"气泡 SVG","default":"assets/comment.svg"},
  {"id":"comment","type":"string","label":"气泡里的话","default":"标题再大一点"},
  {"id":"title","type":"string","label":"标题","default":"huashu-motion"},
  {"id":"subtitle","type":"string","label":"副标题","default":"对着画面指一下，就能改"},
  {"id":"paper","type":"color","label":"影棚底色","default":"#efece6"},
  {"id":"ink","type":"color","label":"文字色","default":"#1d1b18"},
  {"id":"accent","type":"color","label":"强调色","default":"#d9480f"},
  {"id":"body","type":"color","label":"机身颜色","default":"#1d1b18"},
  {"id":"endHold","type":"number","label":"结尾停留（秒）","default":1.4,"min":0,"max":10,"step":0.1,"group":"节奏"}
]'>
<head>
<meta charset="utf-8">
<title>huashu-motion · object-3d</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/om.js"></script>
<script src="vendor/om-three.js"></script>
<style id="om-fonts">
@font-face { font-family: "Inter"; src: url("assets/fonts/Inter-var.woff") format("woff"); font-weight: 100 900; }
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC-700.woff") format("woff"); font-weight: 700; }
</style>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
  #film { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Inter", "Noto Sans SC", sans-serif; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  .type { position: absolute; left: 150px; top: 380px; width: 900px; }
  .type h1 { margin: 0; white-space: nowrap; font-size: 112px; line-height: 1; letter-spacing: -5px; font-weight: 750; }
  .type p { margin: 34px 0 0; font-family: "Noto Sans SC", sans-serif; font-weight: 700; font-size: 50px; line-height: 1.25; }
  .type .bar { width: 120px; height: 10px; background: var(--accent); margin-bottom: 44px; transform-origin: 0 50%; }
</style>
</head>
<body>
<!--
  A real product object in a lit studio, one continuous camera (OM.space) and a WebGL layer driven by the
  timeline (OM3.film). Type stays in the DOM: sharp, editable, pickable.
  Swap the screenshot, the SVGs and the colours for the product's own — never placeholders.
-->
<div id="film" data-composition-id="film" data-width="1920" data-height="1080">
  <canvas id="gl" width="1920" height="1080" data-om-id="scene"></canvas>
  <div class="type" data-om-id="type">
    <div class="bar" data-om-id="bar"></div>
    <h1 data-om-id="title" data-var-text="title">huashu-motion</h1>
    <p data-om-id="subtitle" data-var-text="subtitle">对着画面指一下，就能改</p>
  </div>
</div>

<script>
  const V = OM.vars();
  const D = 10.2 + V.endHold;

  // ---------- the studio ----------
  const stage = OM3.stage(document.getElementById('gl'), { background: V.paper, fov: 30, dof: { aperture: 0.0022, maxblur: 0.009 }, exposure: 1.05 });
  OM3.lights(stage, { span: 9 });
  OM3.cyc(stage, { color: V.paper, y: 0, depth: 34, radius: 9, z: -2 });

  // the product: its real interface on a floating device
  const SW = 4.8, SH = SW / 1.6, CY = 2.5;                 // screen size (the screenshot is 16:10) and centre height
  const device = OM3.screen(V.screen, { width: SW, aspect: 1.6, bezel: 0.07, depth: 0.12, radius: 0.12, body: V.body });
  device.position.set(0, CY, 0);
  stage.add(device);
  // depth around it: two panels lifted out of the same screenshot, at different distances, so every camera
  // move shows parallax (crop: left, top, right, bottom of the image, 0–1)
  const panelA = OM3.screen(V.screen, { width: 1.6, crop: [0.8, 0.05, 1, 0.42], bezel: 0, depth: 0.03, radius: 0.04 });
  panelA.position.set(3.7, CY + 1.0, -1.7); panelA.rotation.set(0, -0.42, 0);
  const panelB = OM3.screen(V.screen, { width: 3.6, crop: [0, 0.865, 0.62, 1], bezel: 0, depth: 0.03, radius: 0.04 });
  panelB.position.set(-2.4, 0.75, 1.9); panelB.rotation.set(-0.5, 0.35, 0);
  stage.add(panelA, panelB);
  const FRONT = 0.12 / 2 + 0.004;
  // a point on the screen, from where it is in the screenshot (0–1 across, 0–1 down)
  const onScreen = (u, v) => new THREE.Vector3((u - 0.5) * SW, CY + (0.5 - v) * SW / 1.6, FRONT);
  const CLICK = onScreen(0.415, 0.735);                   // the film's title in the studio preview

  // the cursor: the studio's own select tool, extruded; its tip is at (5, 3) of a 24-unit icon whose box is 5–19 × 3–19
  const CUR = 0.62, k = CUR / 16, cursor = new THREE.Group();
  const curMesh = OM3.logo(V.cursorSvg, { size: CUR, depth: 0.12, bevel: 0.02, roughness: 0.25, metalness: 0.05 });
  curMesh.position.set(7 * k, -8 * k, 0.08);              // move the tip to the group's origin
  cursor.add(curMesh);
  stage.add(cursor);

  // the comment bubble, with the note written on its face
  const bubble = new THREE.Group(), bubbleMesh = OM3.logo(V.bubbleSvg, { size: 0.92, depth: 0.16, bevel: 0.03, roughness: 0.35 });
  bubble.add(bubbleMesh);
  const note = document.createElement('canvas'); note.width = 1024; note.height = 512;
  const noteTex = new THREE.CanvasTexture(note); noteTex.colorSpace = THREE.SRGBColorSpace; noteTex.anisotropy = 8;
  OM3.ready(document.fonts.load('700 120px "Noto Sans SC"').then(() => {
    const g = note.getContext('2d'); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    let fs = 132; g.font = `700 ${fs}px "Noto Sans SC"`;
    while (g.measureText(V.comment).width > 900 && fs > 40) { fs -= 6; g.font = `700 ${fs}px "Noto Sans SC"`; }
    g.fillText(V.comment, 512, 256); noteTex.needsUpdate = true;
  }));
  const label = new THREE.Mesh(new THREE.PlaneGeometry(0.98, 0.49), new THREE.MeshBasicMaterial({ map: noteTex, transparent: true, toneMapped: false }));
  label.position.set(0, 0.1, 0.13);
  bubble.add(label);
  const BUB = CLICK.clone().add(new THREE.Vector3(0.95, 1.15, 0.75));   // up and to the right: the clicked title stays in view
  bubble.position.copy(BUB);
  stage.add(bubble);

  // the click: a ring on the glass
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.13, 64), new THREE.MeshBasicMaterial({ color: V.accent, transparent: true, toneMapped: false }));
  ring.position.copy(CLICK).add(new THREE.Vector3(0, 0, 0.004));
  stage.add(ring);

  OM3.region('device', device, stage, '设备与截图');
  OM3.region('cursor', cursor, stage, '光标');
  OM3.region('bubble', bubble, stage, '留言气泡');

  // ---------- one camera ----------
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const C = new THREE.Vector3(0, CY, 0);
  const cam = OM.space(stage.camera, { fov: 30 });
  // 0 s: low, close and swinging — the first second already moves a lot
  cam.set({ target: [CLICK.x + 0.4, CLICK.y + 0.5, 0], distance: 3.6, yaw: -52, pitch: -6, roll: 5 });
  tl.addLabel('scene:reveal', 0);
  cam.to(tl, 0, { target: [C.x, C.y, 0], distance: 9.6, yaw: -24, pitch: 7, roll: 0, duration: 1.7, ease: 'expo.out' });
  cam.to(tl, 1.7, { yaw: -12, distance: 8.6, duration: 1.3, ease: 'sine.inOut' });
  // 3.0 s: push into the note (the focus follows the target)
  tl.addLabel('scene:point', 2.2);
  cam.to(tl, 3.15, { target: [BUB.x - 0.1, BUB.y, BUB.z], distance: 3.0, yaw: 14, pitch: 4, duration: 1.15, ease: 'expo.inOut' });
  cam.to(tl, 4.3, { distance: 2.75, yaw: 20, duration: 1.5, ease: 'sine.inOut' });
  // 5.8 s: crane up and swing round the whole object
  tl.addLabel('scene:space', 5.8);
  cam.to(tl, 5.8, { target: [C.x, C.y - 0.3, 0], distance: 15, yaw: 42, pitch: 26, duration: 1.9, ease: 'expo.inOut' });
  // 7.7 s: land on the hero frame, object right, type left
  tl.addLabel('scene:end', 7.7);
  cam.to(tl, 7.7, { target: [C.x - 2.75, C.y - 0.1, 0], distance: 12.6, yaw: 20, pitch: 5, duration: 1.6, ease: 'expo.inOut' });

  // ---------- the objects' motion (plain tweens on plain values; the clock renders them) ----------
  const m = { cx: CLICK.x + 3.4, cy: CLICK.y + 1.9, cz: 1.5, tilt: 0, press: 0, ring: 0, pop: 0, spin: 0, float: 0 };
  tl.fromTo(m, { cx: CLICK.x + 3.4, cy: CLICK.y + 1.9, cz: 1.5 }, { cx: CLICK.x, cy: CLICK.y, cz: FRONT + 0.25, duration: 2.1, ease: 'expo.inOut' }, 0)
    .to(m, { press: 1, duration: 0.12, ease: 'power2.in' }, 2.3)
    .to(m, { press: 0, duration: 0.3, ease: 'power2.out' }, 2.42)
    .fromTo(m, { ring: 0 }, { ring: 1, duration: 0.7, ease: 'expo.out' }, 2.36)
    .fromTo(m, { pop: 0 }, { pop: 1, duration: 0.9, ease: OM.spring(0.35) }, 2.5)
    .to(m, { cx: CLICK.x - 0.35, cy: CLICK.y - 0.45, cz: FRONT + 0.35, duration: 1.0, ease: 'power3.inOut' }, 2.9)
    .fromTo(m, { spin: 0 }, { spin: 1, duration: D - 5.8, ease: 'none' }, 5.8)
    .fromTo(m, { float: 0 }, { float: 1, duration: D, ease: 'none' }, 0);

  OM3.film(stage, tl, D, cam, () => {
    cursor.position.set(m.cx, m.cy, m.cz - m.press * 0.2);
    cursor.rotation.set(-0.15, 0.35 - m.press * 0.2, 0.06);
    ring.scale.setScalar(0.2 + m.ring * 2.2); ring.material.opacity = (1 - m.ring) * (m.ring > 0 ? 1 : 0);
    bubble.scale.setScalar(Math.max(0.001, m.pop));
    bubble.position.set(BUB.x, BUB.y + Math.sin(m.float * D * 1.6) * 0.035 * m.pop, BUB.z * m.pop + FRONT * (1 - m.pop));
    bubble.rotation.y = -0.18 + Math.sin(m.float * D * 0.9) * 0.05;
    device.rotation.y = -0.12 * m.spin;
    panelA.position.y = CY + 1.0 + Math.sin(m.float * D * 0.7 + 1) * 0.06;
    panelB.position.y = 0.75 + Math.sin(m.float * D * 0.6) * 0.05;
  });

  // ---------- type ----------
  tl.fromTo('.type .bar', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'expo.inOut' }, 8.3)
    .fromTo('.type h1', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: 'expo.out' }, 8.45)
    .fromTo('.type p', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: 'expo.out' }, 8.7)
    .to({}, { duration: 0 }, D);

  window.__timelines['film'] = tl;
</script>
</body>
</html>
